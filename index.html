                        if (player.y + player.h <= goal.y + 150 || player.x >= goal.x) goal.state = 'top'; else goal.state = 'crash';
                        state.menuTimer = 0; winLevel();
                    }
                }
            }
            
            blocks.forEach(b => { if(Math.abs(b.x - state.camX) < CULL_DIST) b.update(dt); }); 
            weatherParticles.forEach(p => p.update(dt)); birds.forEach(b => b.update(dt)); clouds.forEach(c => c.update(dt));
            
            for(let i=items.length-1; i>=0; i--) { if(Math.abs(items[i].x - state.camX) < CULL_DIST) items[i].update(dt); if(items[i].life<=0) items.splice(i,1); }
            for(let i=projectiles.length-1; i>=0; i--) { if(Math.abs(projectiles[i].x - state.camX) < CULL_DIST) projectiles[i].update(dt); if(projectiles[i].life<=0) projectiles.splice(i,1); }
            for(let i=playerProjectiles.length-1; i>=0; i--) { if(Math.abs(playerProjectiles[i].x - state.camX) < CULL_DIST) playerProjectiles[i].update(dt); if(playerProjectiles[i].life<=0) playerProjectiles.splice(i,1); }
            for(let i=enemies.length-1; i>=0; i--) { if(Math.abs(enemies[i].x - state.camX) < CULL_DIST) enemies[i].update(dt); if(enemies[i].dead && Math.random()<0.05) enemies.splice(i,1); }
            for(let i=particles.length-1; i>=0; i--) { if(Math.abs(particles[i].x - state.camX) < CULL_DIST) particles[i].update(dt); if(particles[i].life<=0) particles.splice(i,1); }
            for(let i=texts.length-1; i>=0; i--) { if(Math.abs(texts[i].x - state.camX) < CULL_DIST) texts[i].update(dt); if(texts[i].life<=0) texts.splice(i,1); }
            for(let i=meteors.length-1; i>=0; i--) { meteors[i].update(dt); if(meteors[i].life<=0) meteors.splice(i,1); }

            let targetX = player.x - cw * 0.4; if(targetX < 0) targetX = 0; state.camX += (targetX - state.camX) * (1 - Math.pow(0.001, dt));

            if (state.current === GAME_STATES.ENDING) { 
                let pCamX = state.menuTimer * 200; ctx.clearRect(0,0,cw,ch); 
                let oldWorld = state.world; state.world = 1; drawParallax(pCamX);
                
                let floor = ch - 180; let wC = WC[1];
                ctx.fillStyle = wC.gM; ctx.fillRect(0, floor, cw, ch - floor);
                ctx.strokeStyle = wC.gB; ctx.lineWidth = 2; ctx.beginPath();
                let stepY = 15; let floorH = ch - floor; let offsetX = -(pCamX % 30);
                for(let by = stepY; by < floorH; by += stepY) { ctx.moveTo(0, floor + by); ctx.lineTo(cw, floor + by); }
                for(let by = 0; by < floorH; by += stepY) { let offset = (by % (stepY * 2) === 0) ? 0 : 15; for(let bx = offsetX + offset - 30; bx <= cw + 30; bx += 30) { ctx.moveTo(bx, floor + by); ctx.lineTo(bx, floor + by + stepY); } }
                ctx.stroke();
                ctx.fillStyle = wC.gT; ctx.fillRect(0, floor, cw, 12); ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(0, floor+12, cw, 4); ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(0, floor, cw, 3);
                
                state.world = oldWorld; ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(0,0,cw,ch);
            } 
            else { 
                ctx.clearRect(0,0,cw,ch); drawParallax(state.camX); 
                clouds.forEach(c => c.draw(ctx, state.camX)); weatherParticles.forEach(p => p.draw(ctx)); birds.forEach(b => b.draw(ctx, state.camX));
            }
            
            ctx.save(); ctx.translate(-Math.floor(state.camX), 0); 

            if (state.current === GAME_STATES.ENDING) {
                confettis.forEach(c => c.draw(ctx));
                particles.forEach(p => p.draw(ctx)); let floor = ch - 180;
                
                if(!window.endDummyPlayer) { 
                    window.endDummyPlayer = new Player(0, floor - 40); window.endDummyPlayer.setSize('big'); window.endDummyPlayer.hasTorch = true; 
                    window.endDummyPlayer.facing = 1; window.endDummyFireballTimer = 0; window.endDummyFireballs = [];
                }
                window.endDummyPlayer.x = state.camX + cw/2 - 120; window.endDummyPlayer.y = floor - window.endDummyPlayer.h; 
                window.endDummyPlayer.animTimer = state.menuTimer * 15; window.endDummyPlayer.onGround = true; window.endDummyPlayer.vx = 200;
                window.endDummyPlayer.draw(ctx);

                if(!window.endDummyEnemies) { window.endDummyEnemies = [ new Enemy(0, floor, 'walk'), new Enemy(0, floor, 'jump'), new Enemy(0, floor, 'shoot'), new Enemy(0, floor, 'fly') ]; }
                window.endDummyEnemies.forEach((e, i) => { e.x = state.camX + cw/2 + 20 + (i * 70); e.y = e.type === 'fly' ? floor - 100 - e.h : floor - e.h; e.animTimer = state.menuTimer * 20; e.vx = 250; e.draw(ctx); });

                if(window.endDummyFireballs) {
                    window.endDummyFireballs.forEach(fb => {
                        ctx.fillStyle = '#e67e22'; ctx.beginPath(); ctx.arc(fb.x+fb.w/2, fb.y+fb.h/2, 7, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(fb.x+fb.w/2, fb.y+fb.h/2, 4, 0, Math.PI*2); ctx.fill();
                    });
                }
            } else {
                if(goal && goal.draw) goal.draw(ctx);
                blocks.forEach(b => { if(b.x > viewL && b.x < viewR) b.draw(ctx); }); 
                
                items.forEach(i => { if(i.x > viewL && i.x < viewR) i.draw(ctx); });
                enemies.forEach(e => { if(e.x > viewL && e.x < viewR) e.draw(ctx); }); 
                projectiles.forEach(p => { if(p.x > viewL && p.x < viewR) p.draw(ctx); });
                playerProjectiles.forEach(p => { if(p.x > viewL && p.x < viewR) p.draw(ctx); });
                player.draw(ctx); 
                meteors.forEach(m => { if(m.x > viewL && m.x < viewR) m.draw(ctx); });
                
                particles.forEach(p => { if(p.x > viewL && p.x < viewR) p.draw(ctx); }); 
                texts.forEach(t => { if(t.x > viewL && t.x < viewR) t.draw(ctx); });
            }
            ctx.restore();
            
            drawUI();
        }

        // Iniciar el ciclo del juego
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
