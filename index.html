<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fraudio</title>
    <style>
        * {
            box-sizing: border-box; margin: 0; padding: 0;
            -webkit-touch-callout: none; -webkit-user-select: none; -khtml-user-select: none;
            -moz-user-select: none; -ms-user-select: none; user-select: none; touch-action: none; 
            outline: none; -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%; height: 100%; overflow: hidden; background-color: #000; position: fixed;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }
        #gameCanvas { display: block; width: 100%; height: 100%; image-rendering: optimizeSpeed; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let cw, ch;
        function resize() { 
            cw = window.innerWidth; 
            ch = window.innerHeight; 
            canvas.width = cw; 
            canvas.height = ch; 
            state.floorY = ch - 180;
            updateBtnPositions(); 
        }
        window.addEventListener('resize', resize); 

        const TILE = 45; const LEVEL_LENGTH = 300; 
        const PHYS = { GRAVITY: 2400, MAX_FALL: 950, ACCEL: 3000, FRICTION: 0.00001, MAX_SPEED: 350, MAX_SPEED_SAT: 500, JUMP_FORCE: -850, BOUNCE_FORCE: -600 };
        const GAME_STATES = { MENU: 0, PLAYING: 1, DEAD: 2, WIN: 3, GAMEOVER: 4, ENDING: 5 };
        
        const LEVEL_NAMES = [ 
            "", "PRADERAS VERDES", "DESIERTO ROJO", "CUMBRES NEVADAS", 
            "VOLCÁN ACTIVO", "PLAYA CRISTAL", "BOSQUE OSCURO", 
            "CIELO AZUL", "ZONA ABISAL" 
        ];

        let state = { current: GAME_STATES.MENU, lives: 5, score: 0, world: 1, camX: 0, floorY: 0, lastTime: performance.now(), menuTimer: 0, time: 150, difficulty: 1 };
        let player = null;
        let blocks = [], enemies = [], projectiles = [], playerProjectiles = [], items = [], particles = [], texts = [], weatherParticles = [], meteors = [];
        let decors = { layer2: [], layer3: [], layer4: [] };
        
        let goal = null;
        let cheatTaps = 0; let cheatStartTime = 0;
        let hitStopTimer = 0; 
        let wallHitTimer = 0; 

        function checkSecretCheat(x, y) {
            if (x >= 80 && x <= 140 && y >= 10 && y <= 50) {
                let now = performance.now();
                if (cheatTaps === 0 || now - cheatStartTime > 10000) { cheatTaps = 1; cheatStartTime = now; } 
                else { cheatTaps++; }
                if (cheatTaps >= 7 && state.current === GAME_STATES.PLAYING) { cheatTaps = 0; winLevel(); }
            }
        }

        let timerCheatTaps = 0; let timerCheatStartTime = 0;
        function checkTimerCheat(x, y) {
            if (x >= cw/2 - 60 && x <= cw/2 + 60 && y >= 10 && y <= 70) {
                let now = performance.now();
                if (timerCheatTaps === 0 || now - timerCheatStartTime > 5000) { 
                    timerCheatTaps = 1; 
                    timerCheatStartTime = now; 
                } else { 
                    timerCheatTaps++; 
                }
                
                if (timerCheatTaps >= 16 && state.current === GAME_STATES.PLAYING && player) {
                    timerCheatTaps = 0;
                    player.godMode = true;
                    player.satelliteTimer = 9999; 
                    spawnText("¡INVENCIBLE!", player.x + player.w/2, player.y - 40, '#00d2d3', 40);
                    spawnExplosion(player.x, player.y, '#00d2d3', 50);
                    AudioEngine.grow();
                }
            }
        }

        const WC = [
            null, 
            { sT:'#3498db', sB:'#ecf0f1', m:'#34495e', h:'#27ae60', b:'#2ecc71', gT:'#2ecc71', gM:'#8e44ad', gB:'#5b2c6f', eM:'#d35400', eR:'#27ae60' },
            { sT:'#e67e22', sB:'#f39c12', m:'#c0392b', h:'#d35400', b:'#e67e22', gT:'#f1c40f', gM:'#d35400', gB:'#a04000', eM:'#f1c40f', eR:'#2ecc71' },
            { sT:'#2c3e50', sB:'#34495e', m:'#ecf0f1', h:'#bdc3c7', b:'#ecf0f1', gT:'#ffffff', gM:'#3498db', gB:'#21618c', eM:'#3498db', eR:'#ecf0f1' },
            { sT:'#5b2c6f', sB:'#000000', m:'#7f8c8d', h:'#c0392b', b:'#e74c3c', gT:'#e74c3c', gM:'#2c3e50', gB:'#17202a', eM:'#8e44ad', eR:'#c0392b' },
            { sT:'#00FFFF', sB:'#E0FFFF', m:'#F5DEB3', h:'#D2B48C', b:'#FF69B4', gT:'#F5DEB3', gM:'#00CED1', gB:'#008B8B', eM:'#FF69B4', eR:'#00BFFF' },
            { sT:'#4B0082', sB:'#000000', m:'#2F4F4F', h:'#483D8B', b:'#800080', gT:'#8B008B', gM:'#4B0082', gB:'#000000', eM:'#ADFF2F', eR:'#9400D3' },
            { sT:'#87CEEB', sB:'#FFFFFF', m:'#E0FFFF', h:'#ADD8E6', b:'#B0E0E6', gT:'#FFFFFF', gM:'#87CEFA', gB:'#4682B4', eM:'#FFB6C1', eR:'#FFD700' },
            { sT:'#000000', sB:'#001100', m:'#003300', h:'#00FF00', b:'#32CD32', gT:'#00FF00', gM:'#006400', gB:'#000000', eM:'#FF00FF', eR:'#00FFFF' }
        ];

        const keys = { left: false, right: false, up: false, jumpPressedThisFrame: false, shoot: false, shootPressedThisFrame: false };
        const vBtns = { 
            left: { x: 60, y: 0, r: 40, active: false }, 
            right: { x: 160, y: 0, r: 40, active: false }, 
            jump: { x: 0, y: 0, r: 45, active: false },
            shoot: { x: 0, y: 0, r: 40, active: false }
        };
        
        function updateBtnPositions() { 
            vBtns.left.y = ch - 70; 
            vBtns.right.y = ch - 70; 
            vBtns.jump.y = ch - 70; 
            vBtns.jump.x = cw - 70; 
            vBtns.shoot.x = vBtns.left.x; 
            vBtns.shoot.y = vBtns.left.y - 85; 
        }

        function checkTouches(e) {
            e.preventDefault(); let rect = canvas.getBoundingClientRect();
            let prevUp = keys.up; let prevShoot = keys.shoot;
            keys.left = false; keys.right = false; keys.up = false; keys.shoot = false;
            vBtns.left.active = false; vBtns.right.active = false; vBtns.jump.active = false; vBtns.shoot.active = false;
            
            for(let i=0; i<e.touches.length; i++) {
                let tx = e.touches[i].clientX - rect.left, ty = e.touches[i].clientY - rect.top;
                if(Math.hypot(tx-vBtns.left.x, ty-vBtns.left.y)<vBtns.left.r+30) { keys.left=true; vBtns.left.active=true; }
                if(Math.hypot(tx-vBtns.right.x, ty-vBtns.right.y)<vBtns.right.r+30) { keys.right=true; vBtns.right.active=true; }
                if(Math.hypot(tx-vBtns.jump.x, ty-vBtns.jump.y)<vBtns.jump.r+30) { keys.up=true; vBtns.jump.active=true; }
                if(player && player.hasTorch && Math.hypot(tx-vBtns.shoot.x, ty-vBtns.shoot.y)<vBtns.shoot.r+30) { keys.shoot=true; vBtns.shoot.active=true; }
            }
            if (!prevUp && keys.up) keys.jumpPressedThisFrame = true;
            if (!prevShoot && keys.shoot) keys.shootPressedThisFrame = true;
        }

        function handleMenuClick(tx, ty) {
            let btnW = Math.min(cw * 0.85, 380);
            let btnH = 55;
            let titleY = Math.max(80, ch * 0.25);
            let startY = titleY + 60;
            let gap = 65;
            let btnX = cw/2 - btnW/2;
            
            let rects = [
                {x: btnX, y: startY, w: btnW, h: btnH, diff: 0},
                {x: btnX, y: startY + gap, w: btnW, h: btnH, diff: 1},
                {x: btnX, y: startY + gap * 2, w: btnW, h: btnH, diff: 2}
            ];

            for(let r of rects) {
                if(tx >= r.x && tx <= r.x + r.w && ty >= r.y && ty <= r.y + r.h) {
                    state.difficulty = r.diff;
                    AudioEngine.init();
                    resetGame('menu');
                    return true;
                }
            }
            return false;
        }
        
        resize();

        canvas.addEventListener('touchstart', (e) => { 
            let rect = canvas.getBoundingClientRect();
            let isMenu = state.current === GAME_STATES.MENU;
            let menuHandled = false;
            
            for(let i=0; i<e.touches.length; i++) {
                let tx = e.touches[i].clientX - rect.left;
                let ty = e.touches[i].clientY - rect.top;
                
                if (isMenu) {
                    if (handleMenuClick(tx, ty)) { menuHandled = true; break; }
                } else {
                    checkSecretCheat(tx, ty);
                    checkTimerCheat(tx, ty);
                }
            }
            
            if (menuHandled) { e.preventDefault(); return; }
            if (!isMenu) { tryInitGame(); checkTouches(e); }
        }, {passive: false});

        canvas.addEventListener('mousedown', (e) => {
            let rect = canvas.getBoundingClientRect(); 
            let tx = e.clientX - rect.left;
            let ty = e.clientY - rect.top;
            
            if (state.current === GAME_STATES.MENU) {
                handleMenuClick(tx, ty);
            } else {
                tryInitGame();
                checkSecretCheat(tx, ty);
                checkTimerCheat(tx, ty);
            }
        });

        canvas.addEventListener('touchmove', checkTouches, {passive: false});
        canvas.addEventListener('touchend', checkTouches, {passive: false});
        canvas.addEventListener('touchcancel', checkTouches, {passive: false});
        
        window.addEventListener('keydown', e => { 
            if(state.current === GAME_STATES.MENU) return;
            if(e.code==='ArrowLeft'||e.code==='KeyA') keys.left=true; 
            if(e.code==='ArrowRight'||e.code==='KeyD') keys.right=true; 
            if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space'){
                if(!keys.up) keys.jumpPressedThisFrame = true;
                keys.up=true; tryInitGame();
            }
            if(e.code==='ShiftLeft'||e.code==='KeyX') {
                if(!keys.shoot) keys.shootPressedThisFrame = true;
                keys.shoot=true; tryInitGame();
            }
        });
        window.addEventListener('keyup', e => { 
            if(e.code==='ArrowLeft'||e.code==='KeyA') keys.left=false; 
            if(e.code==='ArrowRight'||e.code==='KeyD') keys.right=false; 
            if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space') keys.up=false; 
            if(e.code==='ShiftLeft'||e.code==='KeyX') keys.shoot=false;
        });
        window.addEventListener('blur', () => { 
            keys.left = false; keys.right = false; keys.up = false; keys.shoot = false; 
            vBtns.left.active = false; vBtns.right.active = false; vBtns.jump.active = false; vBtns.shoot.active = false; 
        });

        function tryInitGame() { 
            AudioEngine.init(); 
            if (state.current === GAME_STATES.MENU) return; 
            if(state.current === GAME_STATES.GAMEOVER || (state.current === GAME_STATES.ENDING && state.menuTimer > 6)) resetGame('menu'); 
        }

        const F = { C4:261.6, D4:293.7, E4:329.6, F4:349.2, G4:392.0, A4:440.0, B4:493.9, C5:523.3, D5:587.3, E5:659.3, F5:698.5, G5:784.0, A5:880.0, B5:987.8, C6:1046.5, D6:1174.6 };
        const AudioEngine = {
            ctx: null, masterGain: null, active: false, nextNoteTime: 0, currentNoteIndex: 0, activeMelodyIndex: 0,
            melodies: [
                [ 
                    {n: F.E5, d: 0.125}, {n: F.E5, d: 0.25}, {n: F.E5, d: 0.25}, {n: F.C5, d: 0.125}, {n: F.E5, d: 0.25}, {n: F.G5, d: 0.5}, {n: F.G4, d: 0.5},
                    {n: F.C5, d: 0.375}, {n: F.G4, d: 0.375}, {n: F.E4, d: 0.375}, {n: F.A4, d: 0.25}, {n: F.B4, d: 0.25}, {n: F.A4, d: 0.25}, {n: F.G4, d: 0.25},
                    {n: F.E5, d: 0.25}, {n: F.G5, d: 0.25}, {n: F.A5, d: 0.25}, {n: F.F5, d: 0.125}, {n: F.G5, d: 0.25}, {n: F.E5, d: 0.25}, {n: F.C5, d: 0.125}, {n: F.D5, d: 0.125}, {n: F.B4, d: 0.375},
                    {n: F.C5, d: 0.25}, {n: F.G4, d: 0.25}, {n: F.E4, d: 0.375}, {n: F.A4, d: 0.25}, {n: F.B4, d: 0.25}, {n: F.A4, d: 0.25}, {n: F.G4, d: 0.25},
                    {n: F.E5, d: 0.25}, {n: F.G5, d: 0.25}, {n: F.A5, d: 0.25}, {n: F.F5, d: 0.125}, {n: F.G5, d: 0.25}, {n: F.E5, d: 0.25}, {n: F.C5, d: 0.125}, {n: F.D5, d: 0.125}, {n: F.B4, d: 0.5}
                ]
            ],
            satMelody: [ {n: F.E5, d: 0.125}, {n: F.E5, d: 0.25}, {n: F.E5, d: 0.25}, {n: F.C5, d: 0.125}, {n: F.E5, d: 0.25}, {n: F.G5, d: 0.5} ],
            init() {
                if(this.active) return;
                try {
                    const AC = window.AudioContext || window.webkitAudioContext; this.ctx = new AC();
                    this.masterGain = this.ctx.createGain(); this.masterGain.gain.value = 0.2;
                    this.masterGain.connect(this.ctx.destination);
                    if(this.ctx.state === 'suspended') this.ctx.resume();
                    this.active = true; this.nextNoteTime = this.ctx.currentTime + 0.1;
                } catch(e) {}
            },
            schedule() {
                if (!this.active || state.current !== GAME_STATES.PLAYING) return;
                while(this.nextNoteTime < this.ctx.currentTime + 0.1) {
                    let isSat = player && player.satelliteTimer > 0;
                    let arr = isSat ? this.satMelody : this.melodies[this.activeMelodyIndex];
                    let tempo = isSat ? 160 : 130;
                    
                    if (!isSat && state.time <= 30 && (!player || !player.godMode)) tempo = 180; 

                    let note = arr[this.currentNoteIndex % arr.length];
                    let dur = (60 / tempo) * note.d * 4;
                    this.playNote(note.n, this.nextNoteTime, dur, isSat ? 'triangle' : 'sine'); 
                    this.nextNoteTime += dur; this.currentNoteIndex++;
                }
            },
            playNote(freq, time, dur, type) {
                let osc = this.ctx.createOscillator(); let gain = this.ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, time); osc.connect(gain); gain.connect(this.masterGain);
                gain.gain.setValueAtTime(0, time); gain.gain.linearRampToValueAtTime(0.2, time+0.05); gain.gain.exponentialRampToValueAtTime(0.001, time+dur);
                osc.start(time); osc.stop(time+dur);
            },
            playSFX(f, type, dur, v, slide=null) {
                if(!this.active) return;
                try {
                    let o = this.ctx.createOscillator(); let g = this.ctx.createGain();
                    o.type = type; o.connect(g); g.connect(this.masterGain);
                    o.frequency.setValueAtTime(f, this.ctx.currentTime);
                    if(slide) o.frequency.exponentialRampToValueAtTime(slide, this.ctx.currentTime + dur);
                    g.gain.setValueAtTime(v, this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
                    o.start(); o.stop(this.ctx.currentTime + dur);
                } catch(e) {}
            },
            jump() { this.playSFX(300, 'sine', 0.2, 0.2, 600); },
            bump() { this.playSFX(150, 'triangle', 0.1, 0.3, 50); },
            wallHit() { this.playSFX(90, 'sawtooth', 0.25, 0.4, 40); }, 
            break() { this.playSFX(200, 'square', 0.1, 0.2, 50); setTimeout(()=>this.playSFX(100, 'triangle', 0.1, 0.2, 20), 50); },
            coin() { this.playSFX(F.B5, 'sine', 0.1, 0.2); setTimeout(()=>this.playSFX(F.E5*2, 'sine', 0.3, 0.2), 80); },
            powerupAppears() { this.playSFX(400, 'square', 0.3, 0.1, 800); },
            grow() { let fs=[F.C4,F.E4,F.G4,F.C5,F.E5,F.G5]; fs.forEach((f, i) => setTimeout(()=>this.playSFX(f, 'sine', 0.1, 0.15), i*50)); },
            shrink() { let fs=[F.G5,F.E5,F.C5,F.G4,F.E4,F.C4]; fs.forEach((f, i) => setTimeout(()=>this.playSFX(f, 'triangle', 0.1, 0.15), i*50)); },
            stomp() { this.playSFX(400, 'square', 0.15, 0.2, 100); },
            shoot() { this.playSFX(800, 'triangle', 0.15, 0.1, 200); },
            die() { let fs=[F.B4,F.F4,F.D4,F.B3]; fs.forEach((f, i) => setTimeout(()=>this.playSFX(f, 'triangle', 0.3, 0.2), i*150)); }
        };

        function AABB(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
        function spawnText(txt, x, y, col, size=24) { texts.push(new TextEffect(txt, x, y, col, size)); }
        function spawnExplosion(x, y, col, count) { for(let i=0; i<count; i++) particles.push(new Particle(x, y, col)); }

        class Meteor {
            constructor() {
                this.x = state.camX + Math.random() * (cw + 200) - 100;
                this.y = -100; 
                this.w = 16; this.h = 16;
                this.vy = 400 + Math.random() * 200;
                this.vx = (Math.random() - 0.5) * 150;
                this.life = 10;
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= dt;
                
                if(AABB(this, player)) {
                    if(player.satelliteTimer > 0 || player.godMode) { 
                        this.life = 0; spawnExplosion(this.x, this.y, '#fff', 5); 
                    } else { 
                        player.damage(); this.life = 0; spawnExplosion(this.x, this.y, '#ff4757', 15);
                    }
                }
                
                for(let b of blocks) {
                    if(AABB(this, b)) {
                        this.life = 0;
                        spawnExplosion(this.x, this.y, '#ff4757', 15);
                        if(b.type === 'brick') {
                            AudioEngine.break(); 
                            for(let k=0; k<4; k++) particles.push(new BrickParticle(b.x + TILE/2, b.y + TILE/2, (k%2===0?1:-1)*(Math.random()*150+50), -Math.random()*300-200));
                            blocks.splice(blocks.indexOf(b), 1);
                        }
                        break;
                    }
                }
                
                if (this.y > state.floorY + ch) this.life = 0;
            }
            draw(ctx) {
                if(this.life <= 0) return;
                ctx.save();
                ctx.translate(this.x + this.w/2, this.y + this.h/2);
                ctx.rotate(Math.atan2(this.vy, this.vx) - Math.PI/2); 
                
                ctx.fillStyle = '#f39c12'; ctx.beginPath(); ctx.arc(0, -8, 8, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#c0392b'; ctx.fillRect(-5, -5, 10, 10);
                
                ctx.restore();
            }
        }

        class Player {
            constructor(x, y) {
                this.x = x; this.y = y; this.baseW = 28; this.baseH = 40; this.bigW = 34; this.bigH = 60;
                this.w = this.baseW; this.h = this.baseH; this.vx = 0; this.vy = 0;
                this.onGround = false; this.facing = 1; this.form = 'small'; this.invulnTimer = 0; this.satelliteTimer = 0; this.animTimer = 0;
                this.coyoteTimer = 0; this.jumpBufferTimer = 0; 
                this.squashX = 1; this.squashY = 1; 
                this.hasTorch = false; 
                this.godMode = false;
            }
            update(dt) {
                if(state.current === GAME_STATES.DEAD) { this.vy += PHYS.GRAVITY * dt; this.y += this.vy * dt; return; }
                if(this.invulnTimer > 0) this.invulnTimer -= dt;
                
                this.squashX += (1 - this.squashX) * 10 * dt;
                this.squashY += (1 - this.squashY) * 10 * dt;

                if(this.satelliteTimer > 0) {
                    if (!this.godMode) this.satelliteTimer -= dt;
                    if(this.satelliteTimer <= 0 && !this.godMode) spawnText("FIN SATELITE", this.x, this.y-20, '#fff');
                    else if(Math.random() < 0.4) spawnExplosion(this.x+Math.random()*this.w, this.y+Math.random()*this.h, `hsl(${Math.random()*360},100%,50%)`, 1);
                }
                let maxSpd = this.satelliteTimer > 0 ? PHYS.MAX_SPEED_SAT : PHYS.MAX_SPEED;
                
                if(keys.left) { this.vx -= PHYS.ACCEL * dt; this.facing = -1; }
                if(keys.right) { this.vx += PHYS.ACCEL * dt; this.facing = 1; }
                if(!keys.left && !keys.right) this.vx *= Math.pow(PHYS.FRICTION, dt);
                
                if(this.vx > maxSpd) this.vx = maxSpd; if(this.vx < -maxSpd) this.vx = -maxSpd;
                if(Math.abs(this.vx) < 5) this.vx = 0;

                this.x += this.vx * dt;
                
                for(let b of blocks) {
                    if(AABB(this, b)) {
                        if (this.y + this.h - (this.vy * dt) > b.y + 4) {
                            if(this.vx > 0) {
                                this.x = b.x - this.w;
                            } else if (this.vx < 0) {
                                this.x = b.x + b.w;
                                if (b.x === -TILE) {
                                    if (wallHitTimer <= 0) {
                                        AudioEngine.wallHit();
                                        wallHitTimer = 1.2; 
                                    }
                                }
                            }
                            this.vx = 0;
                        }
                    }
                }
                
                this.vy += PHYS.GRAVITY * dt;
                if(this.vy > PHYS.MAX_FALL) this.vy = PHYS.MAX_FALL;

                if (this.onGround) this.coyoteTimer = 0.12; else this.coyoteTimer -= dt;

                if (keys.jumpPressedThisFrame) { this.jumpBufferTimer = 0.1; keys.jumpPressedThisFrame = false; } 
                else { this.jumpBufferTimer -= dt; }

                if (this.jumpBufferTimer > 0 && (this.onGround || this.coyoteTimer > 0)) {
                    this.vy = PHYS.JUMP_FORCE; 
                    this.onGround = false; 
                    this.coyoteTimer = 0; 
                    this.jumpBufferTimer = 0;
                    AudioEngine.jump(); 
                    spawnExplosion(this.x+this.w/2, this.y+this.h, '#fff', 4);
                    this.squashX = 0.7; this.squashY = 1.3; 
                }

                if (this.hasTorch && keys.shootPressedThisFrame) {

        class PlayerFireball {

        class Block {
            constructor(x, y, type, content=null) { this.x = x; this.y = y; this.w = TILE; this.h = TILE; this.type = type; this.content = content; this.bumpY = 0; }
            bump() { this.bumpY = -15; }
            hit() {
                if(this.type !== 'question') return;
                
                if(this.content === 'telephone') { items.push(new Item(this.x+8, this.y, 'telephone')); AudioEngine.powerupAppears(); }
                else if (this.content === 'heart') { items.push(new Item(this.x+8, this.y, 'heart')); AudioEngine.powerupAppears(); }
                else if (this.content === 'torch') { 
                    if (player && player.form === 'small') { items.push(new Item(this.x+8, this.y, 'telephone')); } 
                    else { items.push(new Item(this.x+8, this.y, 'torch')); }
                    AudioEngine.powerupAppears(); 
                }
                else { items.push(new Item(this.x+10, this.y, 'coin')); AudioEngine.coin(); state.score += 100; }

                spawnExplosion(this.x + this.w/2, this.y + this.h/2, '#f39c12', 15);
                let idx = blocks.indexOf(this);
                if (idx > -1) blocks.splice(idx, 1);

                ctx.save(); ctx.translate(this.x, this.y + this.bumpY);
                if(this.type === 'ground' || this.type === 'underground') {
                    let wC = WC[state.world];
                    ctx.fillStyle = wC.gM; ctx.fillRect(0, 0, this.w, this.h);
                    ctx.strokeStyle = wC.gB; ctx.lineWidth = 2; ctx.beginPath();
                    let stepY = 15;
                    for(let by = stepY; by < this.h; by += stepY) { ctx.moveTo(0, by); ctx.lineTo(this.w, by); }
                    for(let by = 0; by < this.h; by += stepY) {
                        let offset = (by % (stepY * 2) === 0) ? 0 : 15;
                        for(let bx = offset; bx <= this.w; bx += 30) { ctx.moveTo(bx, by); ctx.lineTo(bx, by + stepY); }
                    }
                    ctx.stroke();
                    if(this.type === 'ground') {
                        ctx.fillStyle = wC.gT; ctx.fillRect(0, 0, this.w, 12);
                        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(0, 12, this.w, 4);
                        ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(0, 0, this.w, 3);
                    }
                } else if(this.type === 'brick') {
                    ctx.fillStyle = '#c0392b'; ctx.fillRect(0, 0, this.w, this.h); ctx.strokeStyle = '#922b21'; ctx.lineWidth = 2; ctx.beginPath();
                    ctx.moveTo(0, this.h/2); ctx.lineTo(this.w, this.h/2); ctx.moveTo(this.w/2, 0); ctx.lineTo(this.w/2, this.h/2);
                    ctx.moveTo(this.w/4, this.h/2); ctx.lineTo(this.w/4, this.h); ctx.moveTo(this.w*0.75, this.h/2); ctx.lineTo(this.w*0.75, this.h); ctx.stroke();
                } else if(this.type === 'question') {
                    ctx.fillStyle = '#f39c12'; ctx.fillRect(0, 0, this.w, this.h); ctx.fillStyle = '#f1c40f'; ctx.fillRect(2, 2, this.w-4, this.h-4);
                    let scale = 1 + Math.sin(Date.now()/150) * 0.1;
                    ctx.fillStyle = '#d35400'; ctx.font = '24px Arial Black'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.translate(this.w/2, this.h/2); ctx.scale(scale, scale); ctx.fillText('?', 0, 2);
                } else if(this.type === 'empty') {
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = "rgba(0, 0, 0, 0.2)";
                    ctx.strokeRect(2, 2, this.w - 4, this.h - 4);
                    ctx.strokeRect(2, 2, this.w - 4, this.h - 4);

                ctx.restore();
            }

        class Item {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.type = type; this.w = 28; this.h = 28;
                this.vy = -450; this.vx = (Math.random() > 0.5 ? 1 : -1) * 120; this.life = 1; this.collected = false;
            }
            update(dt) {
                if(this.collected) return;
                if(this.type === 'coin') { this.y += this.vy * dt; this.vy += 900 * dt; this.life -= dt * 2.0; return; }
                
                this.vy += PHYS.GRAVITY * dt;
                if(this.vy > PHYS.MAX_FALL) this.vy = PHYS.MAX_FALL;

                this.x += this.vx * dt;
                for(let b of blocks) {
                    if(AABB(this, b)) {
                        if (this.vy >= 0) {
                            this.x -= this.vx * dt;
                            this.vx *= -1;
                            break;
                        }
                    }
                }

                this.y += this.vy * dt;
                let onGround = false;
                for(let b of blocks) {
                    if(AABB(this, b)) {
                        if(this.vy > 0 && this.y + this.h - this.vy*dt <= b.y + 25) { 
                            this.y = b.y - this.h; 
                            this.vy = 0; 
                            onGround = true;
                        }
                    }
                }
                
                if (onGround) {
                    this.vx *= 0.98;
                }

                if(AABB(this, player)) {
                    this.collected = true; this.life = 0;
                    if(this.type === 'telephone') {
                        AudioEngine.grow();
                        if(player.form === 'small') { player.setSize('big'); spawnText("+ GRANDE", this.x, this.y, '#f1c40f'); spawnExplosion(this.x, this.y, '#f1c40f', 20); } 
                        else { player.setSize('big'); if(!player.godMode) player.satelliteTimer = 15; spawnText("¡FRAUDIO!", player.x, player.y - 50, '#00d2d3', 60); spawnExplosion(player.x, player.y, '#00d2d3', 50); }
                    } else if (this.type === 'torch') {
                        if(!player.hasTorch) {
                            player.hasTorch = true; player.setSize('big'); spawnText("¡FUEGO!", this.x, this.y, '#e74c3c'); spawnExplosion(this.x, this.y, '#e74c3c', 20); AudioEngine.grow();
                        } else {
                            state.lives++; spawnText("❤️ +1", this.x, this.y - 20, '#ff4757'); spawnExplosion(this.x, this.y, '#ff4757', 20);
                            AudioEngine.powerupAppears(); setTimeout(() => AudioEngine.coin(), 100);
                        }
                    } else if (this.type === 'heart') {
                        state.lives++; spawnText("❤️ +1", this.x, this.y - 20, '#ff4757'); spawnExplosion(this.x, this.y, '#ff4757', 20);
                        AudioEngine.powerupAppears(); setTimeout(() => AudioEngine.coin(), 100);
                    }
                }
            }
            draw(ctx) {
                if(this.life <= 0) return; ctx.save(); ctx.translate(this.x+this.w/2, this.y+this.h/2);
                if(this.type==='coin') ctx.globalAlpha = Math.max(0, this.life);
                if(this.type === 'coin') {
                    ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.ellipse(0,0, 10,14, 0,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#f39c12'; ctx.beginPath(); ctx.ellipse(0,0, 5, 10, 0,0,Math.PI*2); ctx.fill();
                } else if(this.type === 'telephone') {
                    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.roundRect(-12, -2, 24, 14, 4); ctx.fill(); 
                    ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(0, 5, 6, 0, Math.PI*2); ctx.fill(); 
                    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.roundRect(-14, -12, 28, 8, 4); ctx.fill(); 
                    ctx.fillStyle = '#2c3e50'; ctx.fillRect(-10, -10, 20, 4); 
                } else if(this.type === 'torch') {
                    ctx.fillStyle = '#8B4513'; ctx.fillRect(-2, -8, 4, 16);
                    let fScale = 1 + Math.sin(Date.now()/100)*0.15;
                    ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(0, -10, 10*fScale, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(0, -10, 5*fScale, 0, Math.PI*2); ctx.fill();
                } else if(this.type === 'heart') {
                    ctx.fillStyle = '#ff4757'; ctx.beginPath(); ctx.arc(-6, -4, 6, Math.PI, 0); ctx.arc(6, -4, 6, Math.PI, 0); ctx.lineTo(0, 10); ctx.fill();
                }
                ctx.restore();
            }
        }

        class Enemy {
            constructor(x, y, type = 'walk') {
                this.w = 30; this.h = 30; this.x = x; this.type = type;
                this.startY = y - this.h; this.y = this.startY;
                this.dead = false; this.animTimer = Math.random() * 10; this.vy = 0;
                
                let speedMod = (state.difficulty === 2) ? 1.5 : 1;
                
                if (type === 'shoot') { this.vx = 0; this.shootTimer = (Math.random() * 2 + 1) / speedMod; }
                else if (type === 'fly') { this.vx = (-70 - (state.world * 10)) * speedMod; }
                else { this.vx = (-80 - (state.world * 15)) * speedMod; this.jumpTimer = (Math.random() * 3 + 1) / speedMod; }
            }
            update(dt) {
                if(this.dead) return;
                
                if (this.type === 'walk' || this.type === 'jump') {
                    this.x += this.vx * dt; 
                    for(let b of blocks) { if(AABB(this, b)) { this.x -= this.vx * dt; this.vx *= -1; break; } }
                    this.vy += PHYS.GRAVITY * dt; this.y += this.vy * dt;
                    let onGround = false;
                    for(let b of blocks) {
                        if(AABB(this, b)) {
                            if(this.vy > 0) { this.y = b.y - this.h; this.vy = 0; onGround = true; } 
                            else if (this.vy < 0) { this.y = b.y + b.h; this.vy = 0; }
                        }
                    }
                    if(onGround) {
                        let edge = false, checkX = this.x + (this.vx > 0 ? this.w + 5 : -5);
                        for(let b of blocks) { if (checkX >= b.x && checkX <= b.x + b.w && Math.abs((this.y+this.h)-b.y) < 5) { edge = true; break; } }
                        if(!edge) this.vx *= -1;
                        
                        if (this.type === 'jump') {
                            this.jumpTimer -= dt;
                            if (this.jumpTimer <= 0) { this.vy = -600; this.jumpTimer = Math.random() * 2 + 2; }
                        }
                    }
                } else if (this.type === 'shoot') {
                    this.vy += PHYS.GRAVITY * dt; this.y += this.vy * dt;
                    for(let b of blocks) { if(AABB(this, b) && this.vy > 0) { this.y = b.y - this.h; this.vy = 0; } }
                    this.shootTimer -= dt;
                    if(this.shootTimer <= 0 && Math.abs(this.x - player.x) < 800 && projectiles.length === 0) { 
                        this.shootTimer = 2.0; projectiles.push(new Projectile(this.x, this.y+10, this.x > player.x ? -1 : 1, state.world)); AudioEngine.shoot();
                    }
                } else if (this.type === 'fly') {
                    this.x += this.vx * dt;
                    this.y = this.startY + Math.sin(this.animTimer * 2) * 40;
                }
                
                this.animTimer += dt * 5;
                if(state.current === GAME_STATES.PLAYING && AABB(this, player)) {
                    if(player.satelliteTimer > 0 || player.godMode) this.die(true);
                    else if(player.vy > 0 && player.y + player.h - (player.vy*dt) <= this.y + this.h/2) { 
                        this.die(false); 
                        player.vy = PHYS.BOUNCE_FORCE; 
                        hitStopTimer = 0.08; 
                    } 
                    else player.damage();
                }
            }
            die(fromSat) {
                this.dead = true; AudioEngine.stomp(); state.score += (this.type === 'fly' ? 300 : 200);
                spawnText(this.type === 'fly' ? "300" : "200", this.x, this.y, '#fff'); 
                spawnExplosion(this.x+this.w/2, this.y+this.h/2, fromSat ? '#00d2d3' : WC[state.world].eM, 15);
            }
            draw(ctx) {
                if(this.dead) return;
                ctx.save(); ctx.translate(this.x + this.w/2, this.y + this.h);
                
                let pX = player ? player.x : (this.x - 100);
                let dir = (pX < this.x) ? 1 : -1; 
                
                if((this.type==='walk' || this.type==='jump' || this.type==='fly') && this.vx > 0) dir = -1;
                ctx.scale(dir, 1); ctx.rotate(Math.sin(this.animTimer) * 0.15);
                let bodyCol = this.type === 'shoot' ? WC[state.world].eR : WC[state.world].eM;
                
                ctx.fillStyle = bodyCol; ctx.beginPath();
                if(this.type === 'walk' || this.type === 'jump' || this.type === 'fly') { 
                    ctx.moveTo(0, -25); ctx.quadraticCurveTo(-20, -25, -15, -5); ctx.lineTo(15, -5); ctx.quadraticCurveTo(20, -25, 0, -25); ctx.fill(); 
                    if (this.type === 'jump') { ctx.fillStyle = '#f1c40f'; ctx.fillRect(-15, -5, 30, 5); }
                    if (this.type === 'fly') { 
                        ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); 
                        let wingY = Math.sin(this.animTimer * 15) * 5;
                        ctx.ellipse(5, -20 + wingY, 12, 5, -0.3, 0, Math.PI*2); ctx.fill(); 
                    }
                } else { 
                    ctx.roundRect(-12, -30, 24, 25, 5); ctx.fill(); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-10, -15, 6, 0, Math.PI*2); ctx.fill(); 
                }
                
                ctx.fillStyle = '#2c3e50'; ctx.beginPath(); ctx.ellipse(-8, -2, 6, 4, 0, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(8, -2, 6, 4, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-5, -20, 4, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(5, -20, 4, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-6, -20, 2, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(4, -20, 2, 0, Math.PI*2); ctx.fill();
                ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-12, -26); ctx.lineTo(-2, -22); ctx.moveTo(12, -26); ctx.lineTo(2, -22); ctx.stroke();
                ctx.restore();
            }
        }

        class Projectile {
            constructor(x, y, dir, world) { this.x = x; this.y = y; this.w = 24; this.h = 24; this.vx = dir * (80 + ((world - 4) * 40)); this.life = 8; }
            update(dt) {
                this.x += this.vx * dt; this.life -= dt;
                if(AABB(this, player)) {
                    if(player.satelliteTimer > 0 || player.godMode) { this.life = 0; spawnExplosion(this.x, this.y, '#fff', 5); } else { player.damage(); this.life = 0; }
                }
            }
            draw(ctx) {
                if(this.life <= 0) return; let cx = this.x + this.w/2, cy = this.y + this.h/2;
                ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI*2); ctx.fill();
                ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.stroke();
                ctx.fillStyle = WC[state.world].eR; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI*2); ctx.fill();

        class Particle {
            constructor(x, y, col) {
                this.x=x; this.y=y; this.col=col; let ang=Math.random()*Math.PI*2, spd=Math.random()*300+100;
                this.vx=Math.cos(ang)*spd; this.vy=Math.sin(ang)*spd - 150; this.life=1; this.size = Math.random()*5+2;
            }
            update(dt) { this.vy += PHYS.GRAVITY * dt; this.x += this.vx * dt; this.y += this.vy * dt; this.life -= dt * 1.5; }
            draw(ctx) { if(this.life<=0) return; ctx.globalAlpha = Math.max(0, this.life); ctx.fillStyle = this.col; ctx.fillRect(this.x, this.y, this.size, this.size); ctx.globalAlpha = 1; }
        }

        class BrickParticle {
            constructor(x, y, vx, vy) {
                this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.life = 1; this.rot = Math.random()*Math.PI; this.rotSpeed = (Math.random()-0.5)*15;
            }
            update(dt) {
                this.vy += PHYS.GRAVITY * dt;
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.rot += this.rotSpeed * dt;
                this.life -= dt * 1.2;
            }
            draw(ctx) {
                if(this.life <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rot);
                ctx.fillStyle = '#c0392b';
                ctx.fillRect(-8, -8, 16, 16);
                ctx.restore();
            }
        }

        class TextEffect {
            constructor(txt, x, y, col, size=24) { this.txt=txt; this.x=x; this.y=y; this.col=col; this.size=size; this.life = 1; }
            update(dt) { this.y -= 80*dt; this.life -= dt; }
            draw(ctx) {
                if(this.life<=0) return; ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.col; ctx.font = `${this.size}px Arial Black`; ctx.strokeStyle = '#000'; ctx.lineWidth=3; ctx.textAlign='center';
                ctx.strokeText(this.txt, this.x, this.y); ctx.fillText(this.txt, this.x, this.y); ctx.globalAlpha = 1;
            }
        }
        
        class WeatherParticle {
            constructor() { this.reset(true); }
            reset(randY = false) {
                this.x = state.camX + Math.random() * (cw + 200) - 100; this.y = randY ? Math.random() * ch : -20; this.life = Math.random() * 2 + 1;
                this.size = Math.random()*4+2; this.col = WC[state.world].wP || '#fff'; this.vx = (Math.random()-0.5)*100; this.vy = Math.random()*150 + 20;
                if(state.world === 2) { this.vx = -Math.random()*300 - 100; this.x = state.camX + cw + 50; }
                else if(state.world === 4) { this.vy = -Math.random()*150 - 50; this.y = ch + 20; }
            }
            update(dt) {
                this.x += this.vx * dt; this.y += this.vy * dt;
                if(state.world === 1) { this.x += Math.sin(Date.now()/500 + this.life) * 2; this.life -= dt * 0.5; if(this.life <= 0) this.reset(); } 
                else if(this.y > ch + 50 || this.y < -50 || this.x < state.camX - 100 || this.x > state.camX + cw + 100) this.reset();
            }
            draw(ctx) {
                ctx.fillStyle = this.col; ctx.globalAlpha = state.world === 1 ? Math.abs(Math.sin(this.life*3)) : 0.7;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
            }
        }

        class Flagpole {
            constructor(x, baseY) {
                this.x = x;
                this.baseY = baseY;
                this.h = TILE * 9; 
                this.y = baseY - this.h;
                this.w = 16;
                this.state = 'idle'; 
                this.animTimer = 0;
            }
            update(dt) {
                if(this.state !== 'idle') this.animTimer += dt * 5; 
            }
            draw(ctx) {
                ctx.save();
                let poleCenter = this.x + this.w/2;
                let globalWave = performance.now() / 200;
                
                if (this.state === 'crash') {
                    let angle = Math.sin(this.animTimer * 15) * 0.15 * Math.max(0, (1 - this.animTimer*0.3));
                    ctx.translate(poleCenter, this.baseY);
                    ctx.rotate(angle);
                    ctx.translate(-poleCenter, -this.baseY);
                }
                
                ctx.fillStyle = '#bdc3c7';
                if (this.state === 'top') {
                    for(let by = this.y; by <= this.baseY; by += 5) {
                        let waveX = Math.sin(this.animTimer * 10 + (by * 0.05)) * 10;
                        ctx.fillRect(this.x + waveX, by, this.w, 6);
                    }
                } else {
                    ctx.fillRect(this.x, this.y, this.w, this.h);
                }

                let ballX = poleCenter;
                let ballY = this.y - 12;
                if (this.state === 'top') ballX += Math.sin(this.animTimer * 10 + (this.y * 0.05)) * 10;
                
                let grd = ctx.createRadialGradient(ballX - 5, ballY - 5, 2, ballX, ballY, 18);
                grd.addColorStop(0, '#f1c40f');
                grd.addColorStop(1, '#d35400');
                ctx.fillStyle = grd;
                ctx.beginPath(); ctx.arc(ballX, ballY, 18, 0, Math.PI*2); ctx.fill();

                let flagX = this.x + this.w;
                let flagY = this.y + 15;
                if (this.state === 'top') flagX += Math.sin(this.animTimer * 10 + (flagY * 0.05)) * 10;
                
                let fTipY = flagY + 25 + Math.sin(globalWave)*8;
                ctx.fillStyle = '#2ecc71';
                ctx.beginPath();
                ctx.moveTo(flagX, flagY);
                ctx.lineTo(flagX + 70, fTipY);
                ctx.lineTo(flagX, flagY + 50);
                ctx.fill();
                
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(flagX + 22, flagY + 25, 12, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#e74c3c';
                ctx.font = 'bold 16px Arial Black'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('F', flagX + 22, flagY + 27);
                
                ctx.restore();
            }
        }

        function buildParallax() {
            decors = { layer2: [], layer3: [], layer4: [] }; const tw = LEVEL_LENGTH * TILE;
            for(let i=0; i<tw; i+=400) decors.layer2.push({x: i + Math.random()*200, w: 300+Math.random()*200, h: 200+Math.random()*150 });
            for(let i=0; i<tw; i+=250) decors.layer3.push({x: i + Math.random()*100, r: 100+Math.random()*100 });
            for(let i=0; i<tw; i+=100) decors.layer4.push({x: i + Math.random()*50, r: 20+Math.random()*40 });
            weatherParticles = []; for(let i=0; i<60; i++) weatherParticles.push(new WeatherParticle());
        }

        buildParallax();

        function drawParallax(camX) {
            let wC = WC[state.world];
            let grd = ctx.createLinearGradient(0,0,0,ch); grd.addColorStop(0, wC.sT); grd.addColorStop(1, wC.sB);
            ctx.fillStyle = grd; ctx.fillRect(0,0,cw,ch);
            
            let voidGrd = ctx.createLinearGradient(0, state.floorY, 0, ch);
            voidGrd.addColorStop(0, wC.sB); 
            voidGrd.addColorStop(1, wC.gB); 
            ctx.fillStyle = voidGrd;
            ctx.fillRect(0, state.floorY, cw, ch - state.floorY);
            
            let darkGrd = ctx.createLinearGradient(0, state.floorY, 0, ch);
            darkGrd.addColorStop(0, 'rgba(0,0,0,0)');
            darkGrd.addColorStop(1, 'rgba(0,0,0,0.6)');
            ctx.fillStyle = darkGrd;
            ctx.fillRect(0, state.floorY, cw, ch - state.floorY);

            let celX = cw*0.8 - camX*0.02;
            if(state.world===1||state.world===2||state.world===5) { ctx.fillStyle='#f1c40f'; ctx.beginPath(); ctx.arc(celX, ch*0.2, 50, 0, Math.PI*2); ctx.fill(); }
            if(state.world===3||state.world===6) { ctx.fillStyle='#ecf0f1'; ctx.beginPath(); ctx.arc(celX, ch*0.2, 40, 0, Math.PI*2); ctx.fill(); ctx.fillStyle=wC.sT; ctx.beginPath(); ctx.arc(celX-10, ch*0.2-10, 35, 0, Math.PI*2); ctx.fill(); }

            ctx.fillStyle = wC.m; for(let d of decors.layer2) { let px = (d.x - camX * 0.1); if(px > -d.w && px < cw) { ctx.beginPath(); ctx.moveTo(px, state.floorY); ctx.lineTo(px+d.w/2, state.floorY-d.h); ctx.lineTo(px+d.w, state.floorY); ctx.fill(); } }
            ctx.fillStyle = wC.h; for(let d of decors.layer3) { let px = (d.x - camX * 0.3); if(px > -d.r && px < cw+d.r) { ctx.beginPath(); ctx.arc(px, state.floorY, d.r, Math.PI, 0); ctx.fill(); } }
            ctx.fillStyle = wC.b; for(let d of decors.layer4) { let px = (d.x - camX * 0.6); if(px > -d.r && px < cw+d.r) { ctx.beginPath(); ctx.arc(px, state.floorY, d.r, Math.PI, 0); ctx.fill(); } }
        }

        function generateLevel(keepState) {
            let oldForm = 'small', oldSat = 0, oldTorch = false, oldGodMode = false; 
            if(keepState && player) { oldForm = player.form; oldSat = player.satelliteTimer; oldTorch = player.hasTorch; oldGodMode = player.godMode; }
            
            blocks = []; enemies = []; projectiles = []; playerProjectiles = []; items = []; particles = []; texts = []; meteors = [];
            
            state.floorY = ch - 180; 
            let curX = 0;
            
            for(let h = 0; h < 15; h++) {
                blocks.push(new Block(-TILE, state.floorY - (h * TILE) + TILE, 'empty'));
            }
            
            for(let i=0; i<15; i++) { 
                for(let d=0; d<6; d++) blocks.push(new Block(curX, state.floorY + d*TILE, d === 0 ? 'ground' : 'underground'));
                curX += TILE; 
            }
            
            player = new Player(150, state.floorY - 50); player.setSize(oldForm); player.satelliteTimer = oldSat; player.hasTorch = oldTorch; player.godMode = oldGodMode;
            
            let phone1 = Math.floor(LEVEL_LENGTH * 0.3), phone2 = Math.floor(LEVEL_LENGTH * 0.7);
            let heartPos = Math.floor(LEVEL_LENGTH * 0.5); 
            let torchPos = Math.floor(LEVEL_LENGTH * 0.4); 

            let mult = state.difficulty === 0 ? 1 : (state.difficulty === 1 ? 2 : 4);
            let numEnemies = (2 + (state.world * 2)) * mult;
            let enemyPositions = new Set();
            while(enemyPositions.size < numEnemies) {
                enemyPositions.add(Math.floor(Math.random() * (LEVEL_LENGTH - 40)) + 25);
            }

            for(let i=15; i<LEVEL_LENGTH; i++) {
                if(Math.random() < 0.1 && i !== heartPos && i !== torchPos) {
                    let gap = Math.floor(Math.random()*2) + 1; curX += TILE * gap; i += gap;
                    for(let j=0; j<5; j++) { 
                        for(let d=0; d<6; d++) blocks.push(new Block(curX, state.floorY + d*TILE, d === 0 ? 'ground' : 'underground'));
                        curX += TILE; i++; 
                    }
                    continue;
                }
                
                for(let d=0; d<6; d++) blocks.push(new Block(curX, state.floorY + d*TILE, d === 0 ? 'ground' : 'underground'));
                
                if (i === heartPos) {
                    blocks.push(new Block(curX, state.floorY - TILE*3, 'question', 'heart'));
                } else if (i === torchPos) {
                    blocks.push(new Block(curX, state.floorY - TILE*3, 'question', 'torch'));
                } else if(Math.random() < 0.25) {
                    let h = Math.floor(Math.random()*2) + 3;
                    if(Math.random() < 0.3) blocks.push(new Block(curX, state.floorY - TILE*h, 'brick'));
                    else {
                        let content = 'coin';
                        if(Math.abs(i - phone1) < 10) { content = 'telephone'; phone1 = -100; } 
                        else if(Math.abs(i - phone2) < 10) { content = 'telephone'; phone2 = -100; }
                        blocks.push(new Block(curX, state.floorY - TILE*h, 'question', content));
                    }
                }
                
                if(enemyPositions.has(i)) {
                    let type = 'walk';
                    let r = Math.random();
                    if (state.world >= 2 && r < 0.3) type = 'fly';
                    else if (state.world >= 3 && r < 0.5) type = 'jump';
                    else if (state.world >= 4 && r < 0.7) type = 'shoot';
                    
                    let eY = (type === 'fly') ? state.floorY - TILE*2 : state.floorY;
                    enemies.push(new Enemy(curX + TILE/2, eY, type));
                }
                curX += TILE;
            }
            
            for(let i=0; i<20; i++) { 
                for(let d=0; d<6; d++) blocks.push(new Block(curX, state.floorY + d*TILE, d === 0 ? 'ground' : 'underground'));
                curX += TILE; 
            }
            
            goal = new Flagpole(curX - TILE*10, state.floorY); 
            
            // NUEVO: ESCALERA CLÁSICA TIPO MARIO
            let stairStart = goal.x - TILE * 11;
            for (let col = 0; col < 8; col++) {
                for (let row = 0; row <= col; row++) {
                    blocks.push(new Block(stairStart + col * TILE, state.floorY - TILE - row * TILE, 'underground'));
                }
            }

            buildParallax();
        }

        function die() {
            if(state.current === GAME_STATES.DEAD || state.current === GAME_STATES.GAMEOVER) return;
            AudioEngine.die(); player.vy = PHYS.JUMP_FORCE; state.lives--;
            state.current = state.lives <= 0 ? GAME_STATES.GAMEOVER : GAME_STATES.DEAD;
            
            setTimeout(() => { 
                if(state.current === GAME_STATES.DEAD) resetGame('death'); 
            }, 3000);
        }

        function winLevel() {
            if(state.current === GAME_STATES.WIN || state.current === GAME_STATES.ENDING) return;
            state.score += Math.floor(state.time) * 10;
            [F.C5, F.E5, F.G5, F.C6, F.C6].forEach((f,i)=>setTimeout(()=>AudioEngine.playSFX(f, 'sine', 0.15, 0.2), i*120));
            
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    if (state.current !== GAME_STATES.WIN && state.current !== GAME_STATES.ENDING) return;
                    let fx = goal.x + (Math.random() - 0.5) * 500; 
                    let fy = goal.baseY - 100 - Math.random() * (ch * 0.7);
                    spawnExplosion(fx, fy, `hsl(${Math.random()*360},100%,50%)`, 40);
                    if (state.current !== GAME_STATES.ENDING) {
                        AudioEngine.playSFX(200 + Math.random()*400, 'triangle', 0.15, 0.1, 50);
                    }
                }, i * 150);
            }
            
            if (state.world >= 8) { 
                state.current = GAME_STATES.ENDING; 
                state.menuTimer = 0; 
            } else { 
                state.current = GAME_STATES.WIN; 
                setTimeout(() => { resetGame('next'); }, 4000); 
            }
        }

        function resetGame(reason) {
            let keepState = false;
            if (reason === 'menu' || reason === 'gameover') { state.lives = 5; state.score = 0; state.world = 1; player = null; } 
            else if (reason === 'next') { state.world++; keepState = true; } 
            
            state.time = 150; 
            AudioEngine.activeMelodyIndex = 0; 
            generateLevel(keepState);
            state.camX = player.x - cw/3; state.current = GAME_STATES.PLAYING; state.lastTime = performance.now();
            AudioEngine.currentNoteIndex = 0; 
            keys.left = false; keys.right = false; keys.up = false; keys.jumpPressedThisFrame = false; keys.shoot = false; keys.shootPressedThisFrame = false;
        }

        function drawUI() {
            let baseSize = Math.max(16, Math.min(24, cw/20)); 
            ctx.fillStyle = '#fff'; ctx.font = baseSize + 'px Impact'; 
            ctx.shadowColor = '#000'; ctx.shadowBlur = 4; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
            
            ctx.textAlign = 'left'; 
            ctx.fillText(`❤️ ${state.lives}   🪙 ${state.score}`, 15, 35); 
            
            ctx.textAlign = 'right'; 
            ctx.fillText(`NIVEL ${state.world}`, cw-15, 30);
            
            ctx.font = (baseSize - 6) + 'px Impact';
            let lvlName = LEVEL_NAMES[state.world] || 'ZONA DESCONOCIDA';
            ctx.fillText(lvlName, cw-15, 50);

            ctx.font = baseSize + 'px Impact';
            ctx.textAlign = 'center'; 
            if(state.time <= 30 && (!player || !player.godMode)) ctx.fillStyle = '#ff4757'; 
            
            let timeText = (player && player.godMode) ? "∞" : Math.max(0, Math.ceil(state.time));
            ctx.fillText(`⏱️ ${timeText}`, cw/2, 40);

            ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;

            if (cw < 1024) { 
                ctx.lineWidth = 4;
                Object.values(vBtns).forEach(b => {
                    if(b === vBtns.shoot && (!player || !player.hasTorch)) return; 
                    
                    let isShoot = (b === vBtns.shoot);
                    ctx.fillStyle = b.active ? (isShoot ? 'rgba(255,100,100,0.6)' : 'rgba(255,255,255,0.6)') : (isShoot ? 'rgba(255,100,100,0.2)' : 'rgba(255,255,255,0.2)'); 
                    ctx.strokeStyle = isShoot ? 'rgba(255,100,100,0.8)' : 'rgba(255,255,255,0.8)';
                    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                });
                
                ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '30px Arial';
                ctx.fillText('◄', vBtns.left.x, vBtns.left.y); ctx.fillText('►', vBtns.right.x, vBtns.right.y); ctx.fillText('▲', vBtns.jump.x, vBtns.jump.y);
                if (player && player.hasTorch) { ctx.font = '24px Arial'; ctx.fillText('🔥', vBtns.shoot.x, vBtns.shoot.y); }
            }

            if (player && player.satelliteTimer > 0 && !player.godMode) {
                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#00d2d3';
                ctx.font = 'bold 80px Impact';
                ctx.shadowColor = '#000'; ctx.shadowBlur = 15; ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 4;
                ctx.fillText(Math.ceil(player.satelliteTimer), cw/2, ch/2 - 40);
                ctx.restore();
            }
        }

        function drawFullScreenUI(dt) {
            state.menuTimer += dt || 0.05; 
            let bounce = Math.sin(state.menuTimer * 3) * 10;
            
            if(state.current === GAME_STATES.MENU) {
                let pCamX = state.menuTimer * 150;
                ctx.clearRect(0,0,cw,ch);
                
                let oldWorld = state.world;
                state.world = 1;
                drawParallax(pCamX);
                state.world = oldWorld;

                let floor = ch - 180;
                let wC = WC[1]; 

                ctx.fillStyle = wC.gM;
                ctx.fillRect(0, floor, cw, ch - floor);

                ctx.strokeStyle = wC.gB; ctx.lineWidth = 2; ctx.beginPath();
                let stepY = 15;
                let floorH = ch - floor;
                let offsetX = -(pCamX % 30);
                for(let by = stepY; by < floorH; by += stepY) {
                    ctx.moveTo(0, floor + by); ctx.lineTo(cw, floor + by);
                }
                for(let by = 0; by < floorH; by += stepY) {
                    let offset = (by % (stepY * 2) === 0) ? 0 : 15;
                    for(let bx = offsetX + offset - 30; bx <= cw + 30; bx += 30) {
                        ctx.moveTo(bx, floor + by); ctx.lineTo(bx, floor + by + stepY);
                    }
                }
                ctx.stroke();

                ctx.fillStyle = wC.gT; ctx.fillRect(0, floor, cw, 12);
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(0, floor+12, cw, 4);
                ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(0, floor, cw, 3);

                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(0,0,cw,ch);

                if(!window.menuDummyPlayer) {
                    window.menuDummyPlayer = new Player(0, floor - 40);
                    window.menuDummyPlayer.setSize('small');
                    window.menuDummyPlayer.facing = 1; 
                }
                window.menuDummyPlayer.x = cw/2 + Math.min(cw*0.25, 120);
                window.menuDummyPlayer.y = floor - window.menuDummyPlayer.h;
                window.menuDummyPlayer.animTimer = state.menuTimer * 15;
                window.menuDummyPlayer.onGround = true; window.menuDummyPlayer.vx = 200;
                window.menuDummyPlayer.draw(ctx);

                if(!window.menuDummyEnemies) {
                    window.menuDummyEnemies = [
                        new Enemy(0, floor, 'walk'),
                        new Enemy(0, floor, 'jump'),
                        new Enemy(0, floor, 'shoot'),
                        new Enemy(0, floor, 'fly')
                    ];
                }
                
                window.menuDummyEnemies.forEach((e, i) => {
                    e.x = cw/2 - 20 - (i * 55);
                    e.y = e.type === 'fly' ? floor - 90 - e.h : floor - e.h;
                    e.animTimer = state.menuTimer * 15;
                    e.vx = 200; 
                    e.draw(ctx);
                });

                let titleY = Math.max(80, ch * 0.25);
                ctx.textAlign = 'center';
                let titleSize = Math.min(cw/5, 90);
                ctx.font = `900 ${titleSize}px "Arial Black", Impact, sans-serif`;

                ctx.lineWidth = 12;
                ctx.strokeStyle = '#000000';
                ctx.strokeText("FRAUDIO", cw/2, titleY + bounce);

                ctx.lineWidth = 6;
                ctx.strokeStyle = '#FFFFFF';
                ctx.strokeText("FRAUDIO", cw/2, titleY + bounce);

                ctx.fillStyle = '#E60012'; 
                ctx.fillText("FRAUDIO", cw/2, titleY + bounce);

                let btnW = Math.min(cw * 0.85, 380);
                let btnH = 55;
                let startY = titleY + 60;
                let gap = 65;
                let btnX = cw/2 - btnW/2;

                let btnData = [
                    { text: "MODO RELAJADO (FÁCIL)", bg: '#4cd137', stroke: '#44bd32' },
                    { text: "EN ESTE VIVES :) (NORMAL)", bg: '#fbc531', stroke: '#e1b12c' },
                    { text: "EN ESTE NO VIVES :( (DIFÍCIL)", bg: '#e84118', stroke: '#c23616' }
                ];

                for(let i=0; i<3; i++) {
                    let by = startY + (i * gap);
                    let pulse = 1 + Math.sin(state.menuTimer * 4 + i) * 0.02;

                    ctx.save();
                    ctx.translate(cw/2, by + btnH/2);
                    ctx.scale(pulse, pulse);
                    ctx.translate(-cw/2, -(by + btnH/2));

                    ctx.beginPath();
                    ctx.roundRect(btnX, by, btnW, btnH, btnH/2);

                    ctx.fillStyle = btnData[i].bg;
                    ctx.fill();

                    ctx.lineWidth = 4;
                    ctx.strokeStyle = btnData[i].stroke;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.roundRect(btnX + 4, by + 4, btnW - 8, btnH - 8, (btnH - 8)/2);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff';
                    let fSize = Math.min(16, cw/25);
                    ctx.font = `900 ${fSize}px "Arial Black", sans-serif`;
                    ctx.shadowColor = 'rgba(0,0,0,0.5)';
                    ctx.shadowBlur = 4;
                    ctx.shadowOffsetY = 2;

                    ctx.fillText(btnData[i].text, cw/2, by + btnH/2 + (fSize/3));
                    ctx.restore();
                }

            } else if (state.current === GAME_STATES.GAMEOVER) {
                ctx.fillStyle = '#000'; ctx.fillRect(0,0,cw,ch);
                ctx.textAlign = 'center'; ctx.font = `bold ${Math.min(cw/8, 80)}px Impact`;
                ctx.fillStyle = '#ff4757'; ctx.fillText("GAME OVER", cw/2, ch/2 + bounce);
                if(Math.floor(state.menuTimer) % 2 === 0) { 
                    ctx.font = `24px Arial Black`; ctx.fillStyle = '#fff'; 
                    ctx.fillText("TOCA PARA REINTENTAR", cw/2, ch*0.7); 
                }
            } 
        }

        function gameLoop(time) {
            requestAnimationFrame(gameLoop);
            
            let now = performance.now();
            let dt = (now - state.lastTime) / 1000; 
            if (dt < 0) dt = 0; 
            if (dt > 0.05) dt = 0.05; 
            state.lastTime = now;
            
            if (hitStopTimer > 0) {
                hitStopTimer -= dt;
                return; 
            }

            if (wallHitTimer > 0) {
                wallHitTimer -= dt;
            }
            
            if (AudioEngine.active) AudioEngine.schedule();
            if (state.current === GAME_STATES.MENU || state.current === GAME_STATES.GAMEOVER) { drawFullScreenUI(dt); return; }

            if (state.current === GAME_STATES.ENDING) {
                state.menuTimer += dt;
                if(Math.random() < 0.05) {
                    spawnExplosion(state.camX + cw/2 + (Math.random()-0.5)*cw, Math.random()*(ch/2), `hsl(${Math.random()*360},100%,50%)`, 40);
                }
                
                if(window.endDummyPlayer) {
                    window.endDummyFireballTimer -= dt;
                    if(window.endDummyFireballTimer <= 0) {
                        window.endDummyFireballTimer = 0.2 + Math.random() * 0.3; 
                        let fb = { 
                            x: window.endDummyPlayer.x + 20, 
                            y: window.endDummyPlayer.y + 20, 
                            vx: 400 + Math.random()*250, 
                            vy: -150 - Math.random()*200, 
                            w: 14, h: 14, life: 2 
                        };
                        window.endDummyFireballs.push(fb);
                    }
                    for(let i=window.endDummyFireballs.length-1; i>=0; i--) {
                        let fb = window.endDummyFireballs[i];
                        fb.vy += PHYS.GRAVITY * dt;
                        fb.x += fb.vx * dt;
                        fb.y += fb.vy * dt;
                        let floorY = ch - 180;
                        if(fb.y + fb.h > floorY) {
                            fb.y = floorY - fb.h;
                            fb.vy = -350;
                        }
                        fb.life -= dt;
                        if(fb.life <= 0) window.endDummyFireballs.splice(i, 1);
                    }
                }
            } else if (state.current === GAME_STATES.WIN) {
                state.menuTimer += dt;
                goal.update(dt);
                if (goal.state === 'crash') {
                    player.vx = 0; 
                    player.vy += PHYS.GRAVITY * dt;
                    player.y += player.vy * dt;
                    let floorY = ch - 180;
                    if (player.y + player.h > floorY) {
                        player.y = floorY - player.h;
                        player.vy = 0;
                        player.onGround = true;
                    }
                    player.animTimer = 0;
                    player.x = goal.x - player.w + 4; 
                } else if (goal.state === 'top') {
                    player.vx = 0; player.vy = 0;
                    player.x = goal.x + goal.w/2 - player.w/2 + Math.sin(goal.animTimer * 10 + (goal.y * 0.05)) * 10;
                    player.y = goal.y - player.h - 26; 
                    player.animTimer += dt * 8; 
                }
            } else {
                player.update(dt);
                if (state.current === GAME_STATES.PLAYING) {
                    if (!player.godMode) state.time -= dt;
                    
                    if (state.difficulty === 2 && Math.random() < 0.015 + (state.world * 0.005)) {
                        meteors.push(new Meteor());
                    }
                    if (state.time <= 0) die();
                    
                    if (player.x + player.w >= goal.x + 8) { 
                        // NUEVO: Hitbox súper generoso para atraparte si saltas alto o te pasas de largo
                        if (player.y + player.h <= goal.y + 150 || player.x >= goal.x) {
                            goal.state = 'top';
                        } else {
                            goal.state = 'crash';
                        }
                        state.menuTimer = 0;
                        winLevel();
                    }
                }
            }
            
            blocks.forEach(b => b.update(dt)); weatherParticles.forEach(p => p.update(dt));
            for(let i=items.length-1; i>=0; i--) { items[i].update(dt); if(items[i].life<=0) items.splice(i,1); }
            for(let i=projectiles.length-1; i>=0; i--) { projectiles[i].update(dt); if(projectiles[i].life<=0) projectiles.splice(i,1); }
            for(let i=playerProjectiles.length-1; i>=0; i--) { playerProjectiles[i].update(dt); if(playerProjectiles[i].life<=0) playerProjectiles.splice(i,1); }
            for(let i=enemies.length-1; i>=0; i--) { enemies[i].update(dt); if(enemies[i].dead && Math.random()<0.05) enemies.splice(i,1); }
            for(let i=particles.length-1; i>=0; i--) { particles[i].update(dt); if(particles[i].life<=0) particles.splice(i,1); }
            for(let i=texts.length-1; i>=0; i--) { texts[i].update(dt); if(texts[i].life<=0) texts.splice(i,1); }
            for(let i=meteors.length-1; i>=0; i--) { meteors[i].update(dt); if(meteors[i].life<=0) meteors.splice(i,1); }

            let targetX = player.x - cw * 0.4; if(targetX < 0) targetX = 0; state.camX += (targetX - state.camX) * (1 - Math.pow(0.001, dt));

            if (state.current === GAME_STATES.ENDING) { 
                let pCamX = state.menuTimer * 200; 
                ctx.clearRect(0,0,cw,ch); 
                
                let oldWorld = state.world;
                state.world = 1;
                drawParallax(pCamX);
                
                let floor = ch - 180;
                let wC = WC[1];
                
                ctx.fillStyle = wC.gM;
                ctx.fillRect(0, floor, cw, ch - floor);

                ctx.strokeStyle = wC.gB; ctx.lineWidth = 2; ctx.beginPath();
                let stepY = 15;
                let floorH = ch - floor;
                let offsetX = -(pCamX % 30);
                for(let by = stepY; by < floorH; by += stepY) {
                    ctx.moveTo(0, floor + by); ctx.lineTo(cw, floor + by);
                }
                for(let by = 0; by < floorH; by += stepY) {
                    let offset = (by % (stepY * 2) === 0) ? 0 : 15;
                    for(let bx = offsetX + offset - 30; bx <= cw + 30; bx += 30) {
                        ctx.moveTo(bx, floor + by); ctx.lineTo(bx, floor + by + stepY);
                    }
                }
                ctx.stroke();

                ctx.fillStyle = wC.gT; ctx.fillRect(0, floor, cw, 12);
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(0, floor+12, cw, 4);
                ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(0, floor, cw, 3);
                
                state.world = oldWorld;
                
                ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(0,0,cw,ch);
            } 
            else { ctx.clearRect(0,0,cw,ch); drawParallax(state.camX); weatherParticles.forEach(p => p.draw(ctx)); }
            
            ctx.save(); ctx.translate(-Math.floor(state.camX), 0); const viewL = state.camX - 100, viewR = state.camX + cw + 100;

            if (state.current === GAME_STATES.ENDING) {
                particles.forEach(p => p.draw(ctx));
                let floor = ch - 180;
                
                if(!window.endDummyPlayer) { 
                    window.endDummyPlayer = new Player(0, floor - 40); 
                    window.endDummyPlayer.setSize('big'); 
                    window.endDummyPlayer.hasTorch = true; 
                    window.endDummyPlayer.facing = 1;
                    window.endDummyFireballTimer = 0;
                    window.endDummyFireballs = [];
                }
                
                window.endDummyPlayer.x = state.camX + cw/2 - 120; 
                window.endDummyPlayer.y = floor - window.endDummyPlayer.h; 
                window.endDummyPlayer.animTimer = state.menuTimer * 15;
                window.endDummyPlayer.onGround = true; window.endDummyPlayer.vx = 200;
                window.endDummyPlayer.draw(ctx);

                if(!window.endDummyEnemies) {
                    window.endDummyEnemies = [
                        new Enemy(0, floor, 'walk'),
                        new Enemy(0, floor, 'jump'),
                        new Enemy(0, floor, 'shoot'),
                        new Enemy(0, floor, 'fly')
                    ];
                }
                
                window.endDummyEnemies.forEach((e, i) => {
                    e.x = state.camX + cw/2 + 20 + (i * 70); 
                    e.y = e.type === 'fly' ? floor - 100 - e.h : floor - e.h;
                    e.animTimer = state.menuTimer * 20; 
                    e.vx = 250; 
                    e.draw(ctx);
                });

                if(window.endDummyFireballs) {
                    window.endDummyFireballs.forEach(fb => {
                        ctx.fillStyle = '#e67e22'; ctx.beginPath(); ctx.arc(fb.x+fb.w/2, fb.y+fb.h/2, 7, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(fb.x+fb.w/2, fb.y+fb.h/2, 4, 0, Math.PI*2); ctx.fill();
                    });
                }
            } else {
                if(goal && goal.draw) goal.draw(ctx);
                blocks.forEach(b => { if(b.x > viewL && b.x < viewR) b.draw(ctx); }); items.forEach(i => { if(i.x > viewL && i.x < viewR) i.draw(ctx); });
                enemies.forEach(e => { if(e.x > viewL && e.x < viewR) e.draw(ctx); }); projectiles.forEach(p => { if(p.x > viewL && p.x < viewR) p.draw(ctx); });
                playerProjectiles.forEach(p => { if(p.x > viewL && p.x < viewR) p.draw(ctx); });
                meteors.forEach(m => { if(m.x > viewL && m.x < viewR) m.draw(ctx); });
                player.draw(ctx); particles.forEach(p => { if(p.x > viewL && p.x < viewR) p.draw(ctx); }); texts.forEach(t => { if(t.x > viewL && t.x < viewR) t.draw(ctx); });
            }
            ctx.restore();

            if (wallHitTimer > 0 && state.current === GAME_STATES.PLAYING) {
                ctx.save();
                ctx.textAlign = 'left';
                let fontSize = Math.max(14, Math.min(24, cw / 22));
                ctx.font = `bold ${fontSize}px "Arial Black", Impact, sans-serif`;
                let msg = "¡FRAUDIO, ES PARA TU OTRA DERECHA! ➔";
                let boxX = 15, boxY = ch - 300; 
                
                ctx.shadowColor = '#000';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 3;
                ctx.shadowOffsetY = 3;

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = fontSize / 4;
                ctx.strokeText(msg, boxX, boxY);

                ctx.fillStyle = '#e60012'; 
                ctx.fillText(msg, boxX, boxY);
                ctx.restore();
            }

            if (state.current === GAME_STATES.ENDING) {
                ctx.textAlign = 'center'; ctx.shadowColor = '#000'; ctx.shadowBlur = 5;
                let bounce = Math.sin(state.menuTimer * 3) * 10;
                ctx.font = `bold ${Math.min(cw/12, 40)}px Arial Black`; ctx.fillStyle = '#f1c40f';
                ctx.fillText("¡GRACIAS POR JUGAR!", cw/2, ch/4 + bounce);
                ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.min(cw/15, 30)}px Arial Black`;
                ctx.fillText("THANKS FOR PLAYING!", cw/2, ch/4 + 40 + bounce);
                
                ctx.font = `bold 24px Arial Black`; ctx.fillStyle = '#2ecc71';
                ctx.fillText("CREADO POR / CREATED BY:", cw/2, ch/2 + 50);
                ctx.fillStyle = '#ff4757'; ctx.font = `bold 32px Impact`;
                ctx.fillText("FRAUDY MARTINEZ", cw/2, ch/2 + 90);
                
                if(state.menuTimer > 6 && Math.floor(state.menuTimer) % 2 === 0) {
                    ctx.font = `18px Arial Black`; ctx.fillStyle = '#fff'; ctx.fillText("TOCA PARA JUGAR OTRA VEZ", cw/2, ch - 30);
                }
                ctx.shadowBlur = 0;
            }
            else if (state.current === GAME_STATES.WIN) {
                ctx.textAlign = 'center'; ctx.shadowColor = '#000'; ctx.shadowBlur = 8;
                let bounce = Math.sin(state.menuTimer * 4) * 10;
                let fontSize = Math.max(40, Math.min(cw/8, 80));
                ctx.font = `bold ${fontSize}px Impact`;
                ctx.fillStyle = '#2ecc71'; 
                ctx.fillText("¡NIVEL", cw/2, ch/3 + bounce);
                ctx.fillStyle = '#fff';
                ctx.fillText("COMPLETADO!", cw/2, ch/3 + fontSize + bounce);
                ctx.shadowBlur = 0;
                drawUI(); 
            }
            else if(state.current === GAME_STATES.PLAYING || state.current === GAME_STATES.DEAD) drawUI();
        }
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
